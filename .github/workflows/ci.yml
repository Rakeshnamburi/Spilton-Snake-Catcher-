name: CI
on:
  push:
  pull_request:
jobs:
  web-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20.19.0, cache: npm}
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm run check:locales
      - run: npm run lint:web
      - run: npm run typecheck
      - run: npm run build:web
      - run: npx expo install --check
        working-directory: apps/mobile
      - run: npx expo export --platform android --output-dir /tmp/spilton-expo-export
        working-directory: apps/mobile
      - run: npm audit --omit=dev --audit-level=critical
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: services/api/requirements.txt}
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest

