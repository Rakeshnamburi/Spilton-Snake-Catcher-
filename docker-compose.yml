services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: spilton
      POSTGRES_USER: spilton
      POSTGRES_PASSWORD: spilton
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spilton"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["private_media:/app/.private_media"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
  private_media:
